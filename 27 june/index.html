<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joke Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        #joke-form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        input, button {
            padding: 10px;
            margin: 5px;
            font-size: 16px;
        }
        #joke {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Joke Generator</h1>
    <form id="joke-form">
        <input type="text" id="joke-type" placeholder="Enter joke type (e.g., knock-knock)" required>
        <button type="submit">Generate Joke</button>
    </form>
    <div id="joke"></div>

    <script>
        document.getElementById('joke-form').addEventListener('submit', async (event) => {
            event.preventDefault();

            const jokeType = document.getElementById('joke-type').value;
            const response = await fetch('http://localhost:3000/generate-joke', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ jokeType }),
            });

            const joke = await response.text();
            document.getElementById('joke').innerText = joke;
        });
    </script>
</body>
</html>
